name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Report build toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: scripts/test.sh "$RUNNER_TEMP/TaskFerryTests"
