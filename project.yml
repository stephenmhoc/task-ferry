name: TaskFerry
configs:
  Debug: debug
  Release: release
  Release-Direct: release
options:
  bundleIdPrefix: com.merimerimeri
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.2.0
    # Lets Xcode gather user-facing strings into TaskFerry/Localizable.xcstrings. A plain build doesn't
    # write them back: an IDE build or `xcodebuild -exportLocalizations -scheme TaskFerry` does.
    SWIFT_EMIT_LOC_STRINGS: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    CODE_SIGN_STYLE: Automatic
    TASK_FERRY_CLOUDFLARE_OAUTH_CLIENT_ID: "fcb358ecbd170213ce612c27de3b4cad"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.32.0
targets:
  TaskFerry:
    type: application
    platform: macOS
    sources:
      - TaskFerry
      # Not optional: generating the project without the connector would silently ship an app
      # that can't provide remote access. Run scripts/fetch-cloudflared.sh first.
      - path: .vendor/cloudflared/cloudflared
        buildPhase:
          copyFiles:
            destination: executables
      - path: .vendor/cloudflared/cloudflared-LICENSE
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - package: Sentry
        product: Sentry
    settings:
      base:
        # Every local build gets its own identity, its own icon, no URL scheme or Services entry,
        # and demo data, so it can never touch the installed app or real reminders. Only
        # Release-Direct, which scripts/release.sh archives, is the real app.
        PRODUCT_BUNDLE_IDENTIFIER: com.merimerimeri.TaskFerry.Debug
        PRODUCT_NAME: TaskFerry
        INFOPLIST_FILE: TaskFerry/Info-Dev.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TASK_FERRY_DEV"
        CODE_SIGN_ENTITLEMENTS: TaskFerry/TaskFerry.entitlements
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
      configs:
        Release-Direct:
          PRODUCT_BUNDLE_IDENTIFIER: com.merimerimeri.TaskFerry
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          INFOPLIST_FILE: TaskFerry/Info-Direct.plist
          CODE_SIGN_ENTITLEMENTS: TaskFerry/TaskFerry-Direct.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPARKLE_ENABLED"
          # Only this configuration has a DSN, so no local build can report. It ships in every
          # copy of the app and can only submit events, so it isn't a secret.
          SENTRY_DSN: https://ca37c3934ccc01469dbfb8eefd314891@o4510771621789696.ingest.us.sentry.io/4512358195920896
    postBuildScripts:
      - name: Sign Cloudflare connector
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/sign-cloudflared.sh" \
            "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/cloudflared" \
            "${EXPANDED_CODE_SIGN_IDENTITY:--}" \
            "$CONFIGURATION"
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/cloudflared
    scheme:
      archive:
        config: Release-Direct
      testTargets:
        - TaskFerryTests
  # One journey through the real app on demo data. Separate from TaskFerryTests, which are
  # host-independent, because it needs a window server. Run it with scripts/test-ui.sh.
  TaskFerryUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - TaskFerryUITests
    dependencies:
      - target: TaskFerry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.merimerimeri.TaskFerryUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: TaskFerry
  TaskFerryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TaskFerryTests
      - TaskFerry/AppState.swift
      - TaskFerry/Models/Models.swift
      - TaskFerry/Models/ReminderLinks.swift
      - TaskFerry/Models/CloudflareModels.swift
      - TaskFerry/Models/RemoteConfiguration.swift
      - TaskFerry/Services/ReminderService.swift
      - TaskFerry/Services/ReminderOperationCoordinator.swift
      - TaskFerry/Services/CredentialStore.swift
      - TaskFerry/Services/Diagnostics.swift
      - TaskFerry/Services/CredentialManager.swift
      - TaskFerry/Services/ReminderConnection.swift
      - TaskFerry/Services/DemoReminderService.swift
      - TaskFerry/Services/BridgeServer.swift
      - TaskFerry/Services/KeychainStore.swift
      - TaskFerry/Services/RemoteReminderService.swift
      - TaskFerry/Services/EventKitReminderService.swift
      - TaskFerry/Services/CloudflareAPIClient.swift
      - TaskFerry/Services/CloudflareCleanupStore.swift
      - TaskFerry/Services/CloudflareOAuthClient.swift
      - TaskFerry/Services/CloudflareTunnelConnector.swift
      - TaskFerry/Services/RequestLedger.swift
      - TaskFerry/Services/SnapshotCache.swift
      - TaskFerry/Services/ReminderNotificationPlan.swift
      - TaskFerry/Services/ReminderUndo.swift
      - TaskFerry/Services/ReminderBatchOperations.swift
      - TaskFerry/Services/ReminderEditSession.swift
      - TaskFerry/Services/TaskFerryRuntime.swift
      - TaskFerry/Services/TaskFerryURL.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.merimerimeri.TaskFerryTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
schemes:
  TaskFerryUI:
    build:
      targets:
        TaskFerry: all
        TaskFerryUITests: [test]
    test:
      config: Debug
      targets:
        - TaskFerryUITests
